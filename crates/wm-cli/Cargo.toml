[package]
name = "wm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "luminactl"

[lib]
name = "wm_cli"
path = "src/lib.rs"

[[bin]]
name = "lumina-wm"
path = "src/bin/lumina-wm.rs"

[[bin]]
name = "luminactl"
path = "src/bin/luminactl.rs"

[dependencies]
wm-proto.workspace = true
reactive-state.workspace = true
sys-providers.workspace = true
html-dom.workspace = true
css-style.workspace = true
layout-engine.workspace = true
renderer.workspace = true
wm-core.workspace = true
ipc-server.workspace = true
compositor.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit = "0.30.13"
softbuffer = "0.4.8"
wayland-server = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["server", "staging", "unstable"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
memmap2 = "0.9.11"
libc = "0.2"

